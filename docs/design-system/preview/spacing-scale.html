<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--card);font-family:var(--font-sans);padding:24px}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .bar{background:var(--brand-blue);height:16px;border-radius:3px}
  .nm{font-size:11px;font-weight:600;color:var(--foreground);width:64px}
  .px{font-size:10px;font-family:var(--font-mono);color:var(--muted-foreground)}
</style></head>
<body>
  <div class="row"><span class="nm">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
  <div class="row"><span class="nm">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row"><span class="nm">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
  <div class="row"><span class="nm">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px · card pad</span></div>
  <div class="row"><span class="nm">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
  <div class="row"><span class="nm">space-8</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
</body></html>
