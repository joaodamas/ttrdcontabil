<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--card);font-family:var(--font-sans);padding:22px;color:var(--foreground)}
  .row{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:0}
  .meta{font-size:10px;font-family:var(--font-mono);color:var(--muted-foreground);width:108px;flex-shrink:0}
</style></head>
<body>
  <div class="row"><span class="meta">2xl / 600</span><span style="font-size:24px;font-weight:600;letter-spacing:-.02em">Visão executiva</span></div>
  <div class="row"><span class="meta">lg / 700</span><span style="font-size:18px;font-weight:700;letter-spacing:-.01em">Saúde do mês</span></div>
  <div class="row"><span class="meta">sm / 600</span><span style="font-size:14px;font-weight:600">Pendências operacionais</span></div>
  <div class="row"><span class="meta">sm / 400 · body</span><span style="font-size:14px">Prioridade calculada por tarefas vencidas e cobranças.</span></div>
  <div class="row"><span class="meta">xs / 500 · muted</span><span style="font-size:12px;color:var(--muted-foreground)">3 lançamento(s) previstos para recebimento.</span></div>
</body></html>
