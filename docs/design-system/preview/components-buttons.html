<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--card);font-family:var(--font-sans);padding:22px;color:var(--foreground)}
  .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);margin:0 0 9px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:10px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;line-height:1;transition:background .12s}
  .btn svg{width:15px;height:15px}
  .primary{background:var(--brand-blue);color:#fff}
  .primary.hov{background:var(--brand-blue-700)}
  .ink{background:var(--foreground);color:var(--background)}
  .outline{background:var(--card);border-color:var(--border);color:var(--foreground)}
  .secondary{background:var(--secondary);color:var(--secondary-foreground)}
  .ghost{background:transparent;color:var(--foreground)}
  .destructive{background:var(--destructive);color:#fff}
  .dsoft{background:color-mix(in oklab,var(--destructive) 10%,transparent);color:var(--destructive)}
  .dis{opacity:.5}
  .sm{height:28px;font-size:13px;padding:0 11px;border-radius:8px}
  .sm svg{width:13px;height:13px}
  .lg{height:40px;font-size:14.5px;padding:0 18px;border-radius:12px}
  .ic{width:32px;justify-content:center;padding:0}
  .tag{font-size:10px;font-family:var(--font-mono);color:var(--muted-foreground);margin-left:4px}
</style></head>
<body>
  <p class="lbl">Hierarquia · default size (h-32)</p>
  <div class="row">
    <button class="btn primary"><i data-lucide="receipt"></i>Emitir NFS-e</button>
    <button class="btn ink"><i data-lucide="plus"></i>Novo</button>
    <button class="btn outline">Ver carteira</button>
    <button class="btn secondary">Editar</button>
    <button class="btn ghost">Cancelar</button>
    <button class="btn ic outline"><i data-lucide="search"></i></button>
  </div>

  <p class="lbl">Estados · primary</p>
  <div class="row">
    <button class="btn primary">Padrão</button>
    <button class="btn primary hov">Hover<span class="tag" style="color:rgba(255,255,255,.7)">/90</span></button>
    <button class="btn primary dis">Disabled<span class="tag" style="color:rgba(255,255,255,.7)">.5</span></button>
    <button class="btn primary"><i data-lucide="loader-2"></i>Carregando…</button>
  </div>

  <p class="lbl">Destrutivo &amp; tamanhos</p>
  <div class="row" style="margin-bottom:0">
    <button class="btn destructive">Excluir</button>
    <button class="btn dsoft">Estornar</button>
    <button class="btn primary sm">Salvar<span class="tag" style="color:rgba(255,255,255,.65)">sm</span></button>
    <button class="btn primary lg"><i data-lucide="arrow-right"></i>Entrar no painel<span class="tag" style="color:rgba(255,255,255,.65)">lg</span></button>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
