<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--card);font-family:var(--font-sans);padding:22px}
  .row{display:flex;gap:16px;align-items:flex-end}
  .item{text-align:center}
  .box{width:78px;height:60px;background:var(--muted);border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--foreground);margin-top:8px}
  .px{font-size:10px;font-family:var(--font-mono);color:var(--muted-foreground)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="nm">lg · input</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="nm">xl · card</div><div class="px">14px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="nm">2xl · KPI</div><div class="px">18px</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="nm">login card</div><div class="px">20px</div></div>
    <div class="item"><div class="box" style="border-radius:9999px;width:60px"></div><div class="nm">full · badge</div><div class="px">pill</div></div>
  </div>
</body></html>
