<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--background);font-family:var(--font-sans);padding:26px}
  .row{display:flex;gap:24px}
  .item{flex:1;text-align:center}
  .box{height:64px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px}
  .nm{font-size:11px;font-weight:600;color:var(--foreground)}
  .px{font-size:10px;font-family:var(--font-mono);color:var(--muted-foreground)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="nm">card-shadow</div><div class="px">0 1px 2px /.04</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card-hover)"></div><div class="nm">hover</div><div class="px">0 2px 8px /.08</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--ring-1-foreground)"></div><div class="nm">ring-1/10</div><div class="px">inset hairline</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-modal)"></div><div class="nm">modal</div><div class="px">layered + ring</div></div>
  </div>
</body></html>
