<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--card);font-family:var(--font-sans);padding:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{border-radius:10px;height:72px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;box-sizing:border-box;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--foreground)}
  .hx{font-size:9px;font-family:var(--font-mono);color:var(--muted-foreground)}
</style></head>
<body>
  <div class="grid">
    <div class="sw" style="background:var(--background)"><div class="nm">background</div><div class="hx">slate-50</div></div>
    <div class="sw" style="background:var(--card)"><div class="nm">card</div><div class="hx">white</div></div>
    <div class="sw" style="background:var(--surface-2)"><div class="nm">surface-2</div><div class="hx">0.975</div></div>
    <div class="sw" style="background:var(--surface-3)"><div class="nm">surface-3</div><div class="hx">0.958</div></div>
    <div class="sw" style="background:var(--muted)"><div class="nm">muted</div><div class="hx">0.958</div></div>
    <div class="sw" style="background:var(--border)"><div class="nm">border</div><div class="hx">0.916</div></div>
    <div class="sw" style="background:var(--muted-foreground)"><div class="nm" style="color:#fff">muted-fg</div><div class="hx" style="color:#fff">0.48</div></div>
    <div class="sw" style="background:var(--foreground)"><div class="nm" style="color:#fff">foreground</div><div class="hx" style="color:#fff">0.13</div></div>
  </div>
</body></html>
